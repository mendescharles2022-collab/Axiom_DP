{% extends "base_auth.html" %}
{% block titulo %}Entrar — Axiom_DP{% endblock %}
{% block conteudo_auth %}

<form class="auth-form" method="post" action="/login">
  <h2>Entrar</h2>
  <p class="texto-muted">Acesse com seu login e senha do escritório.</p>

  <label>Login
    <input type="text" name="login" value="{{ login or '' }}" autofocus required>
  </label>
  <label>Senha
    <input type="password" name="senha" required>
  </label>

  <button type="submit" class="botao botao-auth">Entrar</button>
</form>

{% endblock %}
