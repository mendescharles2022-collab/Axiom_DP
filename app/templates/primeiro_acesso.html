{% extends "base_auth.html" %}
{% block titulo %}Primeiro acesso — Axiom_DP{% endblock %}
{% block conteudo_auth %}

<form class="auth-form" method="post" action="/primeiro-acesso">
  <h2>Bem-vindo ao Axiom_DP</h2>
  <p class="texto-muted">
    Este é o primeiro acesso ao sistema. Crie a conta de administrador
    para começar — ela poderá cadastrar os demais usuários depois.
  </p>

  <label>Nome
    <input type="text" name="nome" value="{{ nome or '' }}" autofocus required>
  </label>
  <label>Login
    <input type="text" name="login" value="{{ login or '' }}" required>
  </label>
  <label>Senha
    <input type="password" name="senha" minlength="8" required>
  </label>
  <label>Confirmar senha
    <input type="password" name="confirmar_senha" minlength="8" required>
  </label>

  <button type="submit" class="botao botao-auth">Criar administrador</button>
</form>

{% endblock %}
