<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>{% block titulo %}Axiom_DP{% endblock %}</title>
<link rel="stylesheet" href="/static/css/base.css">
</head>
<body class="pagina-auth">
  <main class="auth-tela">
    <section class="auth-arte">
      <img src="/static/img/login-ilustracao.svg" alt="" class="auth-ilustracao">
    </section>
    <section class="auth-caixa">
      <div class="auth-marca">
        <h1>Axiom_DP</h1>
        <p class="subtitulo">Departamento Pessoal</p>
      </div>

      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
          {% for categoria, texto in mensagens %}
            <div class="flash flash-{{ categoria }}">{{ texto }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block conteudo_auth %}{% endblock %}
    </section>
  </main>
</body>
</html>
