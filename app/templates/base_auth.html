<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Axiom_DP{% endblock %}</title>
<link rel="stylesheet" href="/static/css/base.css">
</head>
<body class="pagina-auth">
  <main class="auth-tela">
    <div class="auth-caixa">
      <div class="auth-marca">
        <div class="auth-logo">A</div>
        <h1>Axiom_DP</h1>
        <p class="subtitulo">Departamento Pessoal</p>
      </div>

      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
          {% for categoria, texto in mensagens %}
            <div class="flash flash-{{ categoria }}">{{ texto }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block conteudo_auth %}{% endblock %}
    </div>
  </main>
</body>
</html>
