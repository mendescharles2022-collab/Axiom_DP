{% extends "base_manutencao.html" %}
{% block titulo %}Entrar — Manutenção Axiom_DP{% endblock %}
{% block conteudo %}

<section class="card auth-form" style="max-width:360px; margin:40px auto;">
  <h2>Entrar</h2>
  <p class="texto-muted">Só administradores acessam esta porta.</p>

  <form method="post" action="{{ url_for('login') }}">
    <label>Login
      <input type="text" name="login" value="{{ login or '' }}" autofocus required>
    </label>
    <label>Senha
      <input type="password" name="senha" required>
    </label>
    <button type="submit" class="botao botao-auth" style="margin-top:10px;">Entrar</button>
  </form>
</section>

{% endblock %}
