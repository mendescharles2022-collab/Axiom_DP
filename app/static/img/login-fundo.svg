<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E3D"/>
      <stop offset="55%" stop-color="#1F3864"/>
      <stop offset="100%" stop-color="#2C4A80"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C77A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B08D3E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C97B84" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C97B84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C77A"/>
      <stop offset="100%" stop-color="#B08D3E"/>
    </linearGradient>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>

  <!-- Auroras abstratas de fundo -->
  <circle cx="360" cy="260" r="320" fill="url(#goldGlow)" filter="url(#blurBig)"/>
  <circle cx="1180" cy="740" r="300" fill="url(#tealGlow)" filter="url(#blurBig)"/>
  <circle cx="1300" cy="200" r="220" fill="url(#roseGlow)" filter="url(#blurBig)"/>
  <circle cx="250" cy="780" r="200" fill="url(#tealGlow)" filter="url(#blurBig)" opacity="0.6"/>

  <!-- Textura de linhas finas -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="140" x2="1600" y2="60"/>
    <line x1="0" y1="320" x2="1600" y2="260"/>
    <line x1="0" y1="880" x2="1600" y2="940"/>
  </g>

  <!-- Anéis concêntricos abstratos, deslocados para o lado esquerdo -->
  <g transform="translate(430,520)">
    <circle r="230" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.5"/>
    <circle r="180" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.22"/>
    <circle r="280" fill="none" stroke="#4FD1C5" stroke-width="1" opacity="0.28"/>

    <path d="M -205 50 A 230 230 0 0 1 75 -215" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M 180 110 A 280 280 0 0 1 -50 270" fill="none" stroke="#4FD1C5" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

    <circle r="110" fill="#FFFFFF" opacity="0.07"/>
    <circle r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <circle cx="228" cy="-35" r="5" fill="#E8C77A"/>
    <circle cx="-248" cy="72" r="4" fill="#4FD1C5"/>
    <circle cx="84" cy="260" r="3.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="-170" cy="-200" r="3" fill="#C97B84"/>
  </g>

  <!-- partículas soltas do lado direito, perto do cartão de login -->
  <circle cx="1250" cy="420" r="3" fill="#E8C77A" opacity="0.7"/>
  <circle cx="1340" cy="600" r="4" fill="#4FD1C5" opacity="0.6"/>
  <circle cx="1180" cy="820" r="2.5" fill="#FFFFFF" opacity="0.5"/>
</svg>
