<svg width="720" height="900" viewBox="0 0 720 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E3D"/>
      <stop offset="55%" stop-color="#1F3864"/>
      <stop offset="100%" stop-color="#2C4A80"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C77A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B08D3E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C97B84" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C97B84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C77A"/>
      <stop offset="100%" stop-color="#B08D3E"/>
    </linearGradient>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8C77A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8C77A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8C77A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="720" height="900" fill="url(#base)"/>

  <!-- Auroras abstratas de fundo -->
  <circle cx="180" cy="220" r="260" fill="url(#goldGlow)" filter="url(#blurBig)"/>
  <circle cx="560" cy="620" r="240" fill="url(#tealGlow)" filter="url(#blurBig)"/>
  <circle cx="600" cy="160" r="180" fill="url(#roseGlow)" filter="url(#blurBig)"/>

  <!-- Textura de linhas finas -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="120" x2="720" y2="60"/>
    <line x1="0" y1="260" x2="720" y2="200"/>
    <line x1="0" y1="760" x2="720" y2="820"/>
  </g>

  <!-- Composição central: anéis concêntricos abstratos entrelaçados -->
  <g transform="translate(360,430)">
    <circle r="190" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.55"/>
    <circle r="150" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <circle r="230" fill="none" stroke="#4FD1C5" stroke-width="1" opacity="0.3"/>

    <!-- Arco dourado grosso, como um traço de assinatura -->
    <path d="M -170 40 A 190 190 0 0 1 60 -175" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <!-- Arco teal fino cruzando -->
    <path d="M 150 90 A 230 230 0 0 1 -40 225" fill="none" stroke="#4FD1C5" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <!-- Núcleo em vidro fosco -->
    <circle r="92" fill="#FFFFFF" opacity="0.08"/>
    <circle r="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Monograma A abstrato, construído com formas -->
    <g fill="#FFFFFF">
      <path d="M0 -55 L46 55 L26 55 L14 26 L-14 26 L-26 55 L-46 55 Z" opacity="0.95"/>
      <rect x="-9" y="0" width="18" height="10" fill="#0F1E3D" opacity="0.9"/>
    </g>
    <circle cx="0" cy="-55" r="6" fill="url(#ringGrad)"/>

    <!-- pequenas partículas orbitando -->
    <circle cx="188" cy="-30" r="5" fill="#E8C77A"/>
    <circle cx="-205" cy="60" r="4" fill="#4FD1C5"/>
    <circle cx="70" cy="215" r="3.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-140" cy="-165" r="3" fill="#C97B84"/>
  </g>

  <!-- Wordmark -->
  <text x="360" y="760" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Axiom_DP</text>
  <rect x="270" y="782" width="180" height="2" fill="url(#lineFade)"/>
  <text x="360" y="812" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#C9D3E6" text-anchor="middle">DEPARTAMENTO&#160;&#160;PESSOAL</text>
</svg>
